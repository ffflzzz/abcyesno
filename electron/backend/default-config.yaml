delegation:
  provider: custom
  model: agnes-2.5-flash
  base_url: https://apihub.agnes-ai.com/v1
  api_key: cpk-REPLACE_WITH_YOUR_AGNES_API_KEY
providers:
  custom:
    name: Agnes Custom
    api: https://apihub.agnes-ai.com/v1
    api_key: cpk-REPLACE_WITH_YOUR_AGNES_API_KEY
    default_model: agnes-2.5-flash
    models:
      - agnes-2.5-flash
    # Agnes 2.5 Flash Thinking 模式默认关闭，需显式开启（OpenAI 兼容格式）：
    # https://www.agnes-ai.com/zh-Hans/docs/agnes-25-flash#thinking-%E6%A8%A1%E5%BC%8F
    # 开启后流式 delta 返回 reasoning_content，Hermes 转发后前端才能渲染「深度推理」块。
    extra_body:
      chat_template_kwargs:
        enable_thinking: true
model:
  default: agnes-2.5-flash
  provider: custom
  base_url: https://apihub.agnes-ai.com/v1
  api_key: cpk-REPLACE_WITH_YOUR_AGNES_API_KEY
  # Thinking 消耗输出预算，必须给足，否则推理模型在正文前耗尽 max_tokens 会
  # incomplete / content 空（「看不到 thinking / 空气泡」同源问题）。
  max_tokens: 8192
# Keep context files tiny so agent startup stays fast and prompts don't
# blow up with the bundled hermes-fork/AGENTS.md.
context_file_max_chars: 1000
agent:
  # Lower than Hermes' default 90 so a confused/stuck model gives up quickly
  # instead of burning credits and showing repeated interrupt messages.
  max_turns: 10
  # Force provider-native vision (OpenAI-style `image_url` content parts).
  # Agnes is an OpenAI-compatible endpoint and its models do read images, but
  # it isn't in the models.dev capability registry, so `auto` can't prove
  # vision support and silently downgrades to a text-only description of the
  # attachment — the model then never sees the pixels. Declaring it here is
  # what keeps screenshots working.
  image_input_mode: native
toolsets:
  - hermes-cli
# Network: optional proxy for reaching apihub.agnes-ai.com.
#
# 默认直连（留空）。Agnes 本身不强制代理；仅在 DNS 被污染的网络才需要填代理。
# 这里故意留空，避免把本机开发机的代理地址写死、随分发传染到新机器导致出站失败。
# 需要代理时，把下行取消注释并填真实地址：
#   proxy_url: http://127.0.0.1:7897/
network:
  proxy_url: ""
